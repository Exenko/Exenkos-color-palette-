<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relief — Card</title>
<meta name="description" content="The same card, flat and then layered">
<link rel="stylesheet" href="../tokens.css">
</head>
<body>
<nav style="padding:16px 20px 0;font:400 13px/1.6 Inter,system-ui,sans-serif"><a href="./" style="color:var(--primary)">← all examples</a></nav>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
 *,*::before,*::after{box-sizing:border-box}
 body{margin:0;padding:20px;font:400 14px/1.6 "Inter",ui-sans-serif,system-ui,sans-serif;
      background:var(--bg-dark);color:var(--text)}
 h3{font:600 15px/1.3 "Space Grotesk",sans-serif;margin:0}
 .lbl{font:600 11px/1.2 "Inter",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
 .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-muted)}
 .muted{color:var(--text-muted)}
 .cols{display:grid;gap:14px}
 .ba{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
 @media (max-width:760px){.ba{grid-template-columns:1fr}}
</style>
<style>
 .flat{background:var(--bg);border:1px solid var(--border-muted);border-radius:8px;padding:18px;display:grid;gap:12px}
 .flat .av{width:44px;height:44px;border-radius:99px;background:var(--border-muted)}
 .flat .tag{border:1px solid var(--border-muted);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--text-muted)}
 .good{background:var(--bg);background-image:var(--ambient-glow);border-radius:var(--radius-xl);
       padding:18px;display:grid;gap:14px;box-shadow:var(--elev-2)}
 .good .head{display:flex;gap:12px;align-items:center}
 .good .av{width:44px;height:44px;border-radius:99px;background-color:var(--primary);
           background-image:var(--sheen-edge);box-shadow:var(--elev-1);flex:0 0 auto}
 .good .tag{background:var(--bg-lighter);background-image:var(--sheen-soft);border-radius:var(--radius-full);
            padding:3px 10px;font:600 11px/1.5 "Inter",sans-serif;letter-spacing:.04em;box-shadow:inset 0 1px 0 var(--highlight)}
 .stats{background:var(--bg-dark);border-radius:var(--radius-lg);box-shadow:var(--recess-1);
        padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
 .stats b{font:500 17px/1.2 "JetBrains Mono",monospace;font-variant-numeric:tabular-nums;color:var(--text)}
 .btn{background-color:var(--primary);color:var(--on-primary);background-image:var(--sheen-strong);
      border:0;border-radius:var(--radius-md);padding:10px 16px;font:600 14px/1 "Inter",sans-serif;
      box-shadow:var(--elev-2);cursor:pointer;justify-self:start}
 @media (prefers-reduced-motion:no-preference){
   .good{transition:box-shadow var(--dur-base) var(--ease-out),translate var(--dur-base) var(--ease-out)}
   .good:hover{box-shadow:var(--elev-3);translate:0 var(--lift-2)}
   .btn{transition:box-shadow var(--dur-fast) var(--ease-sink),translate var(--dur-fast) var(--ease-sink)}
   .btn:active{box-shadow:var(--recess-1);translate:0 var(--sink-1)}
 }
 .btn:focus-visible{outline:none;box-shadow:var(--ring-focus)}
</style>
<div class="ba">
  <div class="cols"><span class="lbl">Before — one ground, one border</span>
    <div class="flat">
      <div style="display:flex;gap:12px;align-items:center"><div class="av"></div>
        <div><div style="font-weight:600">Avery Chen</div><div class="muted" style="font-size:13px">Platform team</div></div></div>
      <div><span class="tag">Maintainer</span></div>
      <div class="muted" style="font-size:13px">148 merged · 12 open · 4 reviewing</div>
      <button class="flat" style="padding:8px 14px;cursor:pointer;color:inherit;font:inherit;justify-self:start">Message</button>
    </div>
  </div>
  <div class="cols"><span class="lbl">After — layers, a well, a lift</span>
    <div class="good">
      <div class="head"><div class="av"></div>
        <div style="display:grid;gap:1px"><div style="font:600 16px/1.3 'Space Grotesk',sans-serif">Avery Chen</div>
          <div class="muted" style="font-size:13px">Platform team</div></div>
        <span style="flex:1"></span><span class="tag">Maintainer</span></div>
      <div class="stats">
        <div><b>148</b><div class="lbl">merged</div></div>
        <div><b>12</b><div class="lbl">open</div></div>
        <div><b>4</b><div class="lbl">reviewing</div></div>
      </div>
      <button class="btn">Message</button>
    </div>
    <p class="mono" style="margin:0">bg → elev-2 · tag to bg-lighter, border dropped · figures into a recess-1 well</p>
  </div>
</div>


<div class="theme-switch">
  <button type="button" data-set="light">Light</button>
  <button type="button" data-set="dark">Dark</button>
  <button type="button" data-set="system">System</button>
</div>
<style>
  .theme-switch { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    z-index: 20; display: flex; gap: 3px; padding: 3px; border-radius: var(--radius-md, 10px);
    background: var(--bg-dark); box-shadow: var(--recess-1); }
  .theme-switch button { font: 600 12px/1 "Inter", system-ui, sans-serif; cursor: pointer; border: 0; color: var(--text-muted);
    background: transparent; border-radius: var(--radius-sm, 6px); padding: 7px 10px; }
  .theme-switch button[aria-pressed="true"] { color: var(--text); background-color: var(--bg-light);
    background-image: var(--sheen-soft); box-shadow: var(--elev-1); }
  .theme-switch button:focus-visible { outline: none; box-shadow: var(--ring-focus); }
</style>
<script>
  (function () {
    var root = document.documentElement, sw = document.querySelector('.theme-switch');
    var saved = null;
    try { saved = localStorage.getItem('relief-theme'); } catch (e) {}
    function apply(mode) {
      if (mode === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
      Array.prototype.forEach.call(sw.querySelectorAll('button'), function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.set === mode));
      });
      try { localStorage.setItem('relief-theme', mode); } catch (e) {}
    }
    sw.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) apply(b.dataset.set); });
    apply(saved || 'system');
  })();
</script>
</body>
</html>
