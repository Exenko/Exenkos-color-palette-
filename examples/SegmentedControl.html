<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relief — SegmentedControl</title>
<meta name="description" content="Selection as elevation, not just colour">
<link rel="stylesheet" href="../tokens.css">
</head>
<body>
<nav style="padding:16px 20px 0;font:400 13px/1.6 Inter,system-ui,sans-serif"><a href="./" style="color:var(--primary)">← all examples</a></nav>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
 *,*::before,*::after{box-sizing:border-box}
 body{margin:0;padding:20px;font:400 14px/1.6 "Inter",ui-sans-serif,system-ui,sans-serif;
      background:var(--bg-dark);color:var(--text)}
 h3{font:600 15px/1.3 "Space Grotesk",sans-serif;margin:0}
 .lbl{font:600 11px/1.2 "Inter",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
 .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-muted)}
 .muted{color:var(--text-muted)}
 .cols{display:grid;gap:14px}
 .ba{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
 @media (max-width:760px){.ba{grid-template-columns:1fr}}
</style>
<style>
 fieldset{border:0;margin:0;padding:0}
 .plain{display:grid;gap:10px}
 .plain label{display:flex;gap:10px;align-items:flex-start;font-size:14px}
 .track{background:var(--bg-dark);border-radius:var(--radius-lg);box-shadow:var(--recess-1);
        padding:6px;display:grid;gap:6px}
 .opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-md);cursor:pointer;
      background:transparent;color:var(--text-muted)}
 .opt .ic{width:28px;height:28px;border-radius:var(--radius-sm);flex:0 0 auto;display:grid;place-items:center;
          background:var(--bg-light);box-shadow:inset 0 1px 0 var(--highlight)}
 .opt svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
 .opt b{font:600 14px/1.4 "Inter",sans-serif;display:block}
 .opt .hint{font-size:12.5px;line-height:1.45}
 .opt input{margin:4px 0 0;accent-color:var(--primary)}
 .opt:has(input:checked){background-color:var(--bg-light);background-image:var(--sheen-soft);
   box-shadow:var(--elev-2);color:var(--text)}
 .opt:has(input:checked) .ic{background:var(--primary);color:var(--on-primary);box-shadow:var(--elev-1)}
 .opt:has(input:focus-visible){box-shadow:var(--ring-focus),var(--elev-2)}
 @media (prefers-reduced-motion:no-preference){
   .opt{transition:background-color var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out),color var(--dur-base) linear}
 }
</style>
<div class="ba">
  <div class="cols"><span class="lbl">Before — a list of radios</span>
    <fieldset class="plain">
      <label><input type="radio" name="a"> <span><b>Standard</b><br><span class="muted">Balanced speed and quality.</span></span></label>
      <label><input type="radio" name="a" checked> <span><b>Extended</b><br><span class="muted">Slower, more thorough.</span></span></label>
      <label><input type="radio" name="a"> <span><b>Draft</b><br><span class="muted">Fastest, least careful.</span></span></label>
    </fieldset>
  </div>
  <div class="cols"><span class="lbl">After — a well holding one raised option</span>
    <fieldset class="track">
      <label class="opt"><input type="radio" name="b">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg></span>
        <span><b>Standard</b><span class="hint">Balanced speed and quality.</span></span></label>
      <label class="opt"><input type="radio" name="b" checked>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2v4m0 12v4m10-10h-4M6 12H2m15.07-5.07-2.83 2.83M9.76 14.24l-2.83 2.83m0-10.14 2.83 2.83m4.48 4.48 2.83 2.83"/></svg></span>
        <span><b>Extended</b><span class="hint">Slower, more thorough.</span></span></label>
      <label class="opt"><input type="radio" name="b">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg></span>
        <span><b>Draft</b><span class="hint">Fastest, least careful.</span></span></label>
    </fieldset>
    <p class="mono" style="margin:0">track recess-1 on bg-dark · selected option bg-light + elev-2 · its ink lifts to text</p>
  </div>
</div>


<div class="theme-switch">
  <button type="button" data-set="light">Light</button>
  <button type="button" data-set="dark">Dark</button>
  <button type="button" data-set="system">System</button>
</div>
<style>
  .theme-switch { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    z-index: 20; display: flex; gap: 3px; padding: 3px; border-radius: var(--radius-md, 10px);
    background: var(--bg-dark); box-shadow: var(--recess-1); }
  .theme-switch button { font: 600 12px/1 "Inter", system-ui, sans-serif; cursor: pointer; border: 0; color: var(--text-muted);
    background: transparent; border-radius: var(--radius-sm, 6px); padding: 7px 10px; }
  .theme-switch button[aria-pressed="true"] { color: var(--text); background-color: var(--bg-light);
    background-image: var(--sheen-soft); box-shadow: var(--elev-1); }
  .theme-switch button:focus-visible { outline: none; box-shadow: var(--ring-focus); }
</style>
<script>
  (function () {
    var root = document.documentElement, sw = document.querySelector('.theme-switch');
    var saved = null;
    try { saved = localStorage.getItem('relief-theme'); } catch (e) {}
    function apply(mode) {
      if (mode === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
      Array.prototype.forEach.call(sw.querySelectorAll('button'), function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.set === mode));
      });
      try { localStorage.setItem('relief-theme', mode); } catch (e) {}
    }
    sw.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) apply(b.dataset.set); });
    apply(saved || 'system');
  })();
</script>
</body>
</html>
